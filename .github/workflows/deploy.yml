name: Deploy Backend to AWS

on:
  push:
    branches: [master, develop, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - staging
          - production

env:
  NODE_VERSION: "22"
  AWS_REGION: "us-east-1"

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Determine environment based on branch or manual input
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      eb-application: ${{ steps.set-env.outputs.eb-application }}
      eb-environment: ${{ steps.set-env.outputs.eb-environment }}

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set environment variables
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Using manually selected environment: ${{ github.event.inputs.environment }}"
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "Using PRODUCTION configuration (master branch)"
            ENVIRONMENT="production"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "Using STAGING configuration (staging branch)"
            ENVIRONMENT="staging"
          else
            echo "Using DEVELOP configuration (develop branch or other)"
            ENVIRONMENT="develop"
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

          # Set Elastic Beanstalk application and environment names
          case $ENVIRONMENT in
            "production")
              echo "eb-application=${{ secrets.EB_APPLICATION_NAME_PROD }}" >> $GITHUB_OUTPUT
              echo "eb-environment=${{ secrets.EB_ENVIRONMENT_NAME_PROD }}" >> $GITHUB_OUTPUT
              ;;
            "staging")
              echo "eb-application=${{ secrets.EB_APPLICATION_NAME_STAGING }}" >> $GITHUB_OUTPUT
              echo "eb-environment=${{ secrets.EB_ENVIRONMENT_NAME_STAGING }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "eb-application=${{ secrets.EB_APPLICATION_NAME_DEVELOP }}" >> $GITHUB_OUTPUT
              echo "eb-environment=${{ secrets.EB_ENVIRONMENT_NAME_DEVELOP }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests (if available)
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "No tests configured, skipping..."
          fi

      - name: 🔨 Build application
        run: |
          echo "Building backend application for ${{ steps.set-env.outputs.environment }} environment..."
          # Create deployment package
          mkdir -p build
          cp -r src build/
          cp package*.json build/
          cp -r node_modules build/ 2>/dev/null || echo "No node_modules to copy"

      - name: 📦 Create deployment package
        run: |
          echo "Creating deployment package..."
          cd build
          zip -r ../deployment.zip . -x "*.git*" "*.DS_Store*" "node_modules/.cache/*"
          cd ..
          ls -la deployment.zip

      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🚀 Deploy to Elastic Beanstalk
        run: |
          echo "Deploying to ${{ steps.set-env.outputs.environment }} environment..."
          echo "Application: ${{ steps.set-env.outputs.eb-application }}"
          echo "Environment: ${{ steps.set-env.outputs.eb-environment }}"
          
          aws elasticbeanstalk create-application-version \
            --application-name "${{ steps.set-env.outputs.eb-application }}" \
            --version-label "v$(date +%Y%m%d-%H%M%S)-${{ github.sha }}" \
            --description "Deployed from GitHub Actions - ${{ github.event.head_commit.message }}" \
            --source-bundle S3Bucket="${{ secrets.S3_BUCKET_NAME_BACKEND }}",S3Key="deployments/deployment.zip" \
            --auto-create-application

          # Upload deployment package to S3
          aws s3 cp deployment.zip s3://${{ secrets.S3_BUCKET_NAME_BACKEND }}/deployments/deployment.zip

          # Create application version
          aws elasticbeanstalk create-application-version \
            --application-name "${{ steps.set-env.outputs.eb-application }}" \
            --version-label "v$(date +%Y%m%d-%H%M%S)-${{ github.sha }}" \
            --description "Deployed from GitHub Actions - ${{ github.event.head_commit.message }}" \
            --source-bundle S3Bucket="${{ secrets.S3_BUCKET_NAME_BACKEND }}",S3Key="deployments/deployment.zip"

          # Deploy to environment
          aws elasticbeanstalk update-environment \
            --environment-name "${{ steps.set-env.outputs.eb-environment }}" \
            --version-label "v$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"

      - name: ✅ Deployment complete
        run: |
          echo "🎉 Successfully deployed backend to ${{ steps.set-env.outputs.environment }} environment!"
          echo "Application: ${{ steps.set-env.outputs.eb-application }}"
          echo "Environment: ${{ steps.set-env.outputs.eb-environment }}"
          echo "Commit: ${{ github.sha }}"
