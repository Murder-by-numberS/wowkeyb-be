name: Deploy Backend to AWS App Runner

on:
  push:
    branches: [master, develop, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - staging
          - production

env:
  NODE_VERSION: "22"
  AWS_REGION: "us-east-1"

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Determine environment based on branch or manual input
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      app-runner-service: ${{ steps.set-env.outputs.app-runner-service }}

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set environment variables
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Using manually selected environment: ${{ github.event.inputs.environment }}"
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "Using PRODUCTION configuration (master branch)"
            ENVIRONMENT="production"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "Using STAGING configuration (staging branch)"
            ENVIRONMENT="staging"
          else
            echo "Using DEVELOP configuration (develop branch or other)"
            ENVIRONMENT="develop"
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

          # Set App Runner service names
          case $ENVIRONMENT in
            "production")
              echo "app-runner-service=${{ secrets.APP_RUNNER_SERVICE_PROD }}" >> $GITHUB_OUTPUT
              ;;
            "staging")
              echo "app-runner-service=${{ secrets.APP_RUNNER_SERVICE_STAGING }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "app-runner-service=${{ secrets.APP_RUNNER_SERVICE_DEVELOP }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests (if available)
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "No tests configured, skipping..."
          fi

      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Update App Runner Environment Variables
        run: |
          echo "Updating environment variables for ${{ steps.set-env.outputs.environment }} environment..."

          # Set environment-specific secret names
          ENV_UPPER=$(echo "${{ steps.set-env.outputs.environment }}" | tr '[:lower:]' '[:upper:]')

          # Use environment-specific secrets
          case "${{ steps.set-env.outputs.environment }}" in
            "production")
              DATABASE_URI="${{ secrets.DATABASE_URI_PRODUCTION }}"
              TOKEN_SECRET="${{ secrets.TOKEN_SECRET_PRODUCTION }}"
              TOKEN_EXPIRATION="${{ secrets.TOKEN_EXPIRATION_PRODUCTION }}"
              S3_BUCKET="${{ secrets.AWS_S3_BUCKET_NAME_PRODUCTION }}"
              S3_PATH="${{ secrets.AWS_S3_PATH_PRODUCTION }}"
              ;;
            "staging")
              # Use staging-specific secrets
              DATABASE_URI="${{ secrets.DATABASE_URI_STAGING }}"
              TOKEN_SECRET="${{ secrets.TOKEN_SECRET_STAGING }}"
              TOKEN_EXPIRATION="${{ secrets.TOKEN_EXPIRATION_STAGING }}"
              S3_BUCKET="${{ secrets.AWS_S3_BUCKET_NAME_STAGING }}"
              S3_PATH="${{ secrets.AWS_S3_PATH_STAGING }}"
              ;;
            *)
              # Use develop secrets for develop environment
              DATABASE_URI="${{ secrets.DATABASE_URI_DEVELOP }}"
              TOKEN_SECRET="${{ secrets.TOKEN_SECRET_DEVELOP }}"
              TOKEN_EXPIRATION="${{ secrets.TOKEN_EXPIRATION_DEVELOP }}"
              S3_BUCKET="${{ secrets.AWS_S3_BUCKET_NAME_DEVELOP }}"
              S3_PATH="${{ secrets.AWS_S3_PATH_DEVELOP }}"
              ;;
          esac

          # Create environment-specific configuration
          cat > app-runner-config-${{ steps.set-env.outputs.environment }}.json << EOF
          {
            "SourceConfiguration": {
              "CodeRepository": {
                "RepositoryUrl": "https://github.com/Murder-by-numberS/wowkeyb-be",
                "SourceCodeVersion": {
                  "Type": "BRANCH",
                  "Value": "$(if [ "${{ steps.set-env.outputs.environment }}" = "production" ]; then echo "master"; else echo "${{ steps.set-env.outputs.environment }}"; fi)"
                },
                "SourceDirectory": "/",
                "CodeConfiguration": {
                  "ConfigurationSource": "REPOSITORY",
                  "CodeConfigurationValues": {
                    "Runtime": "NODEJS_18",
                    "BuildCommand": "npm ci",
                    "StartCommand": "npm start",
                    "Port": "1337",
                    "RuntimeEnvironmentVariables": {
                      "NODE_ENV": "${{ steps.set-env.outputs.environment }}",
                      "PORT": "1337",
                      "APP_PORT": "1337",
                      "LOG_LEVEL": "info",
                      "FE_URL": "https://wowkeyb.gg",
                      "DATABASE_URI": "$DATABASE_URI",
                      "TOKEN_SECRET": "$TOKEN_SECRET",
                      "TOKEN_EXPIRATION": "$TOKEN_EXPIRATION",
                      "AWS_KEY": "${{ secrets.AWS_ACCESS_KEY_ID }}",
                      "AWS_SECRET_KEY": "${{ secrets.AWS_SECRET_ACCESS_KEY }}",
                      "AWS_REGION": "us-east-1",
                      "AWS_S3_BUCKET_NAME": "$S3_BUCKET",
                      "AWS_S3_PATH": "$S3_PATH"
                    }
                  }
                }
              },
              "AutoDeploymentsEnabled": true,
              "AuthenticationConfiguration": {
                "ConnectionArn": "arn:aws:apprunner:us-east-1:351483928422:connection/wowkeyb-github-connection/e6bc601530a84967a31a97a26dc97ebb"
              }
            }
          }
          EOF

          # Update the App Runner service with new configuration
          aws apprunner update-service \
            --service-arn "${{ steps.set-env.outputs.app-runner-service }}" \
            --cli-input-json file://app-runner-config-${{ steps.set-env.outputs.environment }}.json

          # Clean up config file
          rm app-runner-config-${{ steps.set-env.outputs.environment }}.json

      - name: 🚀 Deploy to App Runner
        run: |
          echo "Deploying to ${{ steps.set-env.outputs.environment }} environment..."
          echo "App Runner Service: ${{ steps.set-env.outputs.app-runner-service }}"

          # Trigger App Runner deployment
          aws apprunner start-deployment \
            --service-arn "${{ steps.set-env.outputs.app-runner-service }}"

      - name: ✅ Deployment complete
        run: |
          echo "🎉 Successfully triggered App Runner deployment!"
          echo "Environment: ${{ steps.set-env.outputs.environment }}"
          echo "Service: ${{ steps.set-env.outputs.app-runner-service }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "App Runner will automatically:"
          echo "  • Pull the latest code from GitHub"
          echo "  • Build and deploy your application"
          echo "  • Scale based on traffic"
          echo "  • Only charge for actual usage"
