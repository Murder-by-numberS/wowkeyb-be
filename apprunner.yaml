version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - echo "Installing dependencies..."
      - npm ci
      - echo "Build completed"
run:
  runtime-version: 22
  command: npm start
  network:
    port: 1337
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "1337"
